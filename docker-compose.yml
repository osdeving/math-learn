services:
    # MongoDB Database
    mongodb:
        image: mongo:7.0
        container_name: math-learn-mongodb
        restart: unless-stopped
        environment:
            MONGO_INITDB_ROOT_USERNAME: admin
            MONGO_INITDB_ROOT_PASSWORD: password123
            MONGO_INITDB_DATABASE: mathlearn
        ports:
            - "27017:27017"
        volumes:
            - mongodb_data:/data/db
            - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
        networks:
            - math-learn-network
        healthcheck:
            test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s

    # Next.js Application
    nextjs:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: math-learn-nextjs
        restart: unless-stopped
        environment:
            NODE_ENV: production
            MONGODB_URI: mongodb://admin:password123@mongodb:27017/mathlearn?authSource=admin
            NEXTAUTH_URL: http://localhost:3000
            NEXTAUTH_SECRET: your-super-secret-key-change-in-production
        ports:
            - "3000:3000"
        depends_on:
            mongodb:
                condition: service_healthy
        networks:
            - math-learn-network
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s

    # MongoDB Admin Interface (opcional)
    mongo-express:
        image: mongo-express:1.0.0
        container_name: math-learn-mongo-express
        restart: unless-stopped
        environment:
            ME_CONFIG_MONGODB_ADMINUSERNAME: admin
            ME_CONFIG_MONGODB_ADMINPASSWORD: password123
            ME_CONFIG_MONGODB_URL: mongodb://admin:password123@mongodb:27017/
            ME_CONFIG_BASICAUTH_USERNAME: admin
            ME_CONFIG_BASICAUTH_PASSWORD: admin123
        ports:
            - "8081:8081"
        depends_on:
            mongodb:
                condition: service_healthy
        networks:
            - math-learn-network

volumes:
    mongodb_data:
        driver: local

networks:
    math-learn-network:
        driver: bridge
